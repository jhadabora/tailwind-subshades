name: Node.js CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Test Package with Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.19.0', '24.15.0', 'latest']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Build Package
        run: npm run build

      - name: Run Tests
        run: npm test run

      - name: Pack Package
        run: npm pack
